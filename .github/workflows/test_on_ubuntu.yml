name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3.12', '3.4.10', '4.0.7', '4.1.0-preview1', 'head']
        duckdb: ['1.4.5', '1.5.6', '2.0.0']
    env:
      # Released Bundler is broken on ruby-head and 4.1.0-preview1 due to ruby/ruby#16895.
      # Use Ruby's bundled Bundler until rubygems/rubygems#9529 is released.
      BUNDLER_VERSION: ${{ (matrix.ruby == 'head' || matrix.ruby == '4.1.0-preview1') && '0' || '' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: duckdb cache
      id: duckdb-cache
      uses: actions/cache@v4
      with:
        path: libduckdb-linux-amd64
        key: ${{ runner.os }}-duckdb-v${{ matrix.duckdb }}

    - name: Download duckdb ${{ matrix.duckdb }}
      if: steps.duckdb-cache.outputs.cache-hit != 'true'
      env:
        DUCKDB_VERSION: ${{ matrix.duckdb }}
      run: |
        # DuckDB 2.0 ships duckdb-shared-libs-*.tar.gz instead of libduckdb-*.zip.
        case "${DUCKDB_VERSION}" in
          "2.0.0") ASSET="duckdb-shared-libs-linux-amd64.tar.gz"; EXPECTED_SHA256="993ad89e7dfca66cd6da994c2cad090c2fc160ddf9f550498a098ab4bb13cfb1" ;;
          "1.5.6") ASSET="libduckdb-linux-amd64.zip"; EXPECTED_SHA256="b845005f5132a7d8180057c35e14a7626632258782f871a90861b19c1c03841b" ;;
          "1.4.5") ASSET="libduckdb-linux-amd64.zip"; EXPECTED_SHA256="291efb2e127492ec5b652fb728a29587837763dac1d96bf211dc6429f10149b5" ;;
          *) echo "No known SHA256 for DuckDB v${DUCKDB_VERSION}"; exit 1 ;;
        esac
        curl -OL https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${ASSET}
        echo "${EXPECTED_SHA256}  ${ASSET}" | sha256sum -c
        mkdir libduckdb-linux-amd64
        case "${ASSET}" in
          *.zip) unzip ${ASSET} -d libduckdb-linux-amd64 ;;
          *) tar xzf ${ASSET} -C libduckdb-linux-amd64 ;;
        esac

    - name: setup libduckdb.so
      run: |
        sudo cp libduckdb-linux-amd64/libduckdb.so /usr/local/lib/
        sudo ldconfig

    - name: Build with Ruby ${{ matrix.ruby }}
      run: |
        bundle exec rake build -- --with-duckdb-include=${GITHUB_WORKSPACE}/libduckdb-linux-amd64 --with-duckdb-lib=${GITHUB_WORKSPACE}/libduckdb-linux-amd64

    - name: confirm duckdb library version
      env:
        EXPECTED_DUCKDB_VERSION: ${{ matrix.duckdb }}
      run: |
        ruby -Ilib -rduckdb -e '
          actual = DuckDB::LIBRARY_VERSION
          expected = ENV.fetch("EXPECTED_DUCKDB_VERSION")
          abort("Expected DuckDB #{expected}, got #{actual}") if actual != expected
          puts "duckdb library #{actual}"
        '

    # A UDF callback that strands the dispatcher wedges the VM with the GVL
    # held, so the run never returns. Bound the step: the suite takes ~1 minute.
    - name: test with Ruby ${{ matrix.ruby }}
      timeout-minutes: 3
      env:
        MYSQL_TEST: 1
      run: |
        env RUBYOPT=-W:deprecated bundle exec rake test

  post-test:
    name: All tests passed on Ubuntu
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo ok
